name: deploy-site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: website
          path: site-src

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-src/package-lock.json

      - name: Build
        working-directory: site-src
        run: |
          npm ci
          npm run build

      - name: Add data snapshot
        run: |
          mkdir -p site-src/dist/data/v1
          rsync -a --exclude=.git --exclude=.github data-src/ site-src/dist/data/v1/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-src/dist
      - id: deployment
        uses: actions/deploy-pages@v4
