name: website-deploy

# Requires repository Settings -> Pages -> Source: GitHub Actions.
# The github-pages environment must allow the website branch.
on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site-src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-src/package-lock.json

      - name: Build
        working-directory: site-src
        run: |
          npm ci
          npm run build

      - name: Configure raw data source
        run: |
          printf '%s\n' '{"base":"https://raw.githubusercontent.com/Elfiawesome/comms.io/data/"}' > site-src/dist/data-config.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-src/dist
      - id: deployment
        uses: actions/deploy-pages@v4
